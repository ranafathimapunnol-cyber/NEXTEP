services:
  db:
    image: postgres:16
    container_name: nextep_deploy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextep_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fullstack
    volumes:
      - deploy_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    image: ranafathimap/nextep-backend:latest
    container_name: nextep_deploy_backend
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextep_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fullstack
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8001:8000"
    depends_on:
      - db

  frontend:
    image: ranafathimap/nextep-frontend:latest
    container_name: nextep_deploy_frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    depends_on:
      - backend

volumes:
  deploy_postgres_data: